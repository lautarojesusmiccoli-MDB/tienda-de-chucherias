<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍭 Tienda de Chucherías</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link active" href="/categorias">Categorías</a>
                <a class="nav-link" href="/inventario">Inventario</a>
                <a class="nav-link" href="/ventas">Ventas</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Gestión de Categorías</h2>
        <div class="card p-3 shadow-sm mb-4">
            <form method="POST" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Nombre de Categoría:</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Porcentaje de Ganancia (%):</label>
                    <input type="number" step="any" name="porcentaje" class="form-control" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Guardar Categoría</button>
                </div>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Nombre</th><th>Porcentaje (%)</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td>{{ cat[0] }}</td>
                        <td>{{ cat[1] }}</td>
                        <td>{{ cat[2] }}%</td>
                        <td><a href="/categorias/eliminar/{{ cat[0] }}" class="btn btn-danger btn-sm">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
