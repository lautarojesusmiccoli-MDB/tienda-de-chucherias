<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍭 Tienda de Chucherías</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/categorias">Categorías</a>
                <a class="nav-link" href="/inventario">Inventario</a>
                <a class="nav-link active" href="/ventas">Ventas</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Registro y Control de Ventas</h2>
        <div class="card p-3 shadow-sm mb-4">
            <form method="POST" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Seleccionar Producto:</label>
                    <select name="producto" class="form-select" required>
                        <option value="">Elige un producto con stock...</option>
                        {% for prod in productos_disponibles %}
                        <option value="{{ prod }}">{{ prod }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cantidad:</label>
                    <input type="number" name="cantidad" class="form-control" min="1" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-info text-white w-100 fw-bold">Registrar Venta</button>
                </div>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Producto</th><th>Cantidad</th><th>Total Cobrado</th><th>Fecha / Hora</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    {% for v in ventas %}
                    <tr>
                        <td>{{ v[0] }}</td>
                        <td>{{ v[1] }}</td>
                        <td>{{ v[2] }}</td>
                        <td class="fw-bold text-danger">${{ "%.2f"|format(v[3]) }}</td>
                        <td>{{ v[4] }}</td>
                        <td><a href="/ventas/eliminar/{{ v[0] }}" class="btn btn-danger btn-sm">Eliminar / Devolver Stock</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
