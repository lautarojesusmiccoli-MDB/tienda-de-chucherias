<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="mb-4 text-center">Editar Categoría</h2>
                    <form method="POST">
                        <!-- ID OCULTO CRUCIAL PARA LA ACTUALIZACIÓN -->
                        <input type="hidden" name="id" value="{{ categoria[0] }}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de Categoría:</label>
                            <input type="text" name="nombre" value="{{ categoria[1] }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Porcentaje de Ganancia (%):</label>
                            <input type="number" step="any" name="porcentaje" value="{{ categoria[2] }}" class="form-control" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn btn-primary px-4">Actualizar</button>
                            <a href="/categorias" class="btn btn-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
