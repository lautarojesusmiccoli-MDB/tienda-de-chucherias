<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="mb-4 text-center">Editar Producto</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Producto:</label>
                            <input type="text" name="nombre" value="{{ producto[1] }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoría:</label>
                            <select name="categoria" class="form-select" required>
                                {% for cat in categorias %}
                                <option value="{{ cat[0] }}" {% if cat[0] == producto[2] %}selected{% endif %}>{{ cat[0] }} ({{ cat[1] }}%)</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Precio Compra ($):</label>
                            <input type="number" step="any" name="precio_compra" value="{{ producto[3] }}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Stock:</label>
                            <input type="number" name="stock" value="{{ producto[4] }}" class="form-control" required>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn btn-primary px-4">Actualizar</button>
                            <a href="/inventario" class="btn btn-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
