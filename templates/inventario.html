<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍭 Tienda de Chucherías</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/categorias">Categorías</a>
                <a class="nav-link active" href="/inventario">Inventario</a>
                <a class="nav-link" href="/ventas">Ventas</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Control de Inventario</h2>
        <div class="card p-3 shadow-sm mb-4">
            <form method="POST" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Producto:</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Categoría:</label>
                    <select name="categoria" class="form-select" required>
                        <option value="">Selecciona...</option>
                        {% for cat in categorias %}
                        <option value="{{ cat[0] }}">{{ cat[0] }} ({{ cat[1] }}%)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Precio Compra ($):</label>
                    <input type="number" step="any" name="precio_compra" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Stock:</label>
                    <input type="number" name="stock" class="form-control" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                </div>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Producto</th><th>Categoría</th><th>Precio Compra</th><th>Precio Venta (Auto)</th><th>Stock</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    {% for p in productos %}
                    <tr>
                        <td>{{ p[0] }}</td>
                        <td>{{ p[1] }}</td>
                        <td>{{ p[2] }}</td>
                        <td>${{ "%.2f"|format(p[3]) }}</td>
                        <td class="fw-bold text-success">${{ "%.2f"|format(p[4]) }}</td>
                        <td>{{ p[5] }}</td>
                        <td><a href="/inventario/eliminar/{{ p[0] }}" class="btn btn-danger btn-sm">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
